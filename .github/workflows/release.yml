name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Android SDK check
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Windows client
        working-directory: apps/desktop
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 \
            go build -trimpath -ldflags "-H windowsgui -s -w" -o "$GITHUB_WORKSPACE/ClipBridge.exe" .

      - name: Linux binary
        working-directory: apps/desktop
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 \
            go build -trimpath -ldflags "-s -w" -o "$GITHUB_WORKSPACE/clipbridge" .

      - name: Linux package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ROOT="$GITHUB_WORKSPACE/pkgroot"
          mkdir -p "$ROOT/DEBIAN" "$ROOT/usr/bin" \
                   "$ROOT/usr/share/applications" \
                   "$ROOT/usr/share/icons/hicolor/256x256/apps"
          sed "s/^Version: .*/Version: $VERSION/" packaging/deb/DEBIAN/control > "$ROOT/DEBIAN/control"
          install -m 755 "$GITHUB_WORKSPACE/clipbridge" "$ROOT/usr/bin/clipbridge"
          install -m 644 packaging/clipbridge.desktop "$ROOT/usr/share/applications/clipbridge.desktop"
          install -m 644 packaging/icons/clipbridge.png \
            "$ROOT/usr/share/icons/hicolor/256x256/apps/clipbridge.png"
          dpkg-deb --root-owner-group --build "$ROOT" \
            "$GITHUB_WORKSPACE/clipbridge_${VERSION}_amd64.deb"

      - name: Android app
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Collect Android build
        run: cp android/app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/ClipBridge.apk"

      - name: Checksums
        run: |
          cd "$GITHUB_WORKSPACE"
          sha256sum ClipBridge.exe clipbridge_*_amd64.deb ClipBridge.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ClipBridge.exe
            clipbridge_*_amd64.deb
            ClipBridge.apk
            SHA256SUMS.txt
          generate_release_notes: true
