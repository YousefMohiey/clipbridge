<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClipBridge</title>
<style>
  :root {
    --base: #1a1c1f;
    --rail: #202326;
    --deep: #141618;
    --raised: #292c30;
    --line: #2b2f34;
    --line-soft: #24282c;
    --ink: #eff0f1;
    --ink-2: #c3c9cf;
    --muted: #8b949c;
    --accent: #3daee9;
    --good: #27ae60;
    --bad: #da4453;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--base);
    color: var(--ink);
    font: 12.5px/1.5 "Noto Sans", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    user-select: none;
    cursor: default;
    overflow: hidden;
  }
  ::selection { background: rgba(61, 174, 233, .35); }
  ::-webkit-scrollbar { width: 11px; }
  ::-webkit-scrollbar-thumb { background: #33383e; border: 3px solid var(--base); border-radius: 7px; }
  ::-webkit-scrollbar-thumb:hover { background: #444b52; }
  ::-webkit-scrollbar-track { background: transparent; }

  .app {
    height: 100%;
    display: grid;
    grid-template-columns: 258px minmax(0, 1fr);
    grid-template-rows: minmax(0, 1fr) 26px;
  }

  .rail {
    background: var(--rail);
    border-right: 1px solid var(--line);
    display: flex; flex-direction: column;
    min-height: 0;
  }
  .rail-head {
    height: 42px; flex: none;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 10px 0 14px;
    border-bottom: 1px solid var(--line);
    font-size: 12.5px; color: var(--ink);
  }
  .icon-btn {
    width: 24px; height: 24px; padding: 0;
    display: grid; place-items: center;
    background: transparent; border: 0; border-radius: 4px;
    color: var(--muted); cursor: pointer;
  }
  .icon-btn:hover { background: #2a2f35; color: var(--ink); }
  .icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .rail-body { flex: 1; overflow-y: auto; padding: 8px 8px 8px; min-height: 0; }
  .section { color: var(--muted); font-size: 11px; padding: 6px 6px; }
  .dev {
    display: flex; align-items: center; gap: 10px;
    padding: 7px 8px; border-radius: 4px;
    border: 1px solid transparent;
    cursor: pointer;
  }
  .dev:hover { background: #24282d; }
  .dev.selected { background: #1a212b; border-color: #2f4a5e; }
  .dev .glyph { color: var(--ink-2); flex: none; display: grid; place-items: center; }
  .dev .meta { min-width: 0; display: flex; flex-direction: column; }
  .dev .name { font-size: 12.5px; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dev .status { font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dev.selected .glyph { color: var(--accent); }

  .rail-foot {
    flex: none; height: 34px;
    display: flex; align-items: center; gap: 8px;
    padding: 0 14px; border-top: 1px solid var(--line);
    color: var(--muted); font-size: 11px;
  }
  .rail-foot .dot { width: 7px; height: 7px; border-radius: 50%; background: #5a636b; flex: none; }
  .rail-foot .dot.on { background: var(--good); }

  .content { display: flex; flex-direction: column; min-height: 0; min-width: 0; padding: 16px 18px 0; }
  .pane-head { flex: none; }
  .pane-title { font-size: 15px; color: var(--ink); }
  .pane-sub { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .pane-sub code { font-family: "Noto Sans Mono", Consolas, ui-monospace, monospace; font-size: 11.5px; color: var(--ink-2); }

  .group { flex: none; margin-top: 14px; display: flex; flex-direction: column; min-height: 0; }
  .group.grow { flex: 1 1 auto; }
  .group-label { color: var(--muted); font-size: 11px; padding: 0 2px 6px; }

  .rows {
    background: var(--deep);
    border: 1px solid var(--line-soft);
    border-radius: 5px;
    overflow: hidden;
  }
  .rows.grow { overflow-y: auto; }

  .row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    min-height: 33px; padding: 0 11px;
    border-bottom: 1px solid var(--line-soft);
  }
  .rows > .row:last-child { border-bottom: 0; }
  .row .label { font-size: 12.5px; color: var(--ink-2); }

  .switch { cursor: pointer; }
  .switch input { position: absolute; opacity: 0; width: 0; height: 0; }
  .track {
    width: 30px; height: 16px; border-radius: 8px;
    background: #2b3036; border: 1px solid #383f46;
    position: relative; display: block;
    transition: background .15s ease, border-color .15s ease;
  }
  .track::after {
    content: ""; position: absolute; top: 2px; left: 2px;
    width: 10px; height: 10px; border-radius: 50%;
    background: #8b949c;
    transition: transform .16s cubic-bezier(.2,.8,.2,1), background .15s ease;
  }
  .switch input:checked + .track { background: rgba(61,174,233,.25); border-color: #2f6e8f; }
  .switch input:checked + .track::after { transform: translateX(14px); background: var(--accent); }
  .switch input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }
  .switch.danger input:checked + .track { background: rgba(218,68,83,.22); border-color: #6d2f36; }
  .switch.danger input:checked + .track::after { background: var(--bad); }

  .row.plain { padding: 0; }
  .addr { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; padding: 5px 11px; }
  .addr input {
    flex: 1; min-width: 0;
    background: transparent; border: 0; outline: none;
    color: var(--ink); font: 12px/1.4 "Noto Sans Mono", Consolas, ui-monospace, monospace;
    padding: 3px 0;
  }
  .addr input::placeholder { color: var(--muted); }
  .addr.dirty input { color: var(--accent); }
  .mini {
    display: none;
    font: inherit; font-size: 11.5px; color: var(--ink);
    background: var(--raised); border: 1px solid #3a4048; border-radius: 4px;
    padding: 3px 9px; cursor: pointer;
  }
  .mini:hover { background: #32383f; }
  .addr.dirty .mini { display: block; }

  .clip {
    display: grid; grid-template-columns: 62px 48px minmax(0, 1fr) auto;
    align-items: center; gap: 10px;
    min-height: 34px; padding: 6px 11px;
    border-bottom: 1px solid var(--line-soft);
    cursor: pointer;
  }
  .rows > .clip:last-child { border-bottom: 0; }
  .clip:hover { background: #191c1f; }
  .clip:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .clip .time { font: 11px/1 "Noto Sans Mono", Consolas, ui-monospace, monospace; color: var(--muted); }
  .clip .kind { font-size: 10.5px; color: var(--muted); }
  .clip .kind.image { color: var(--accent); }
  .clip .text { font-size: 12.5px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .clip .origin { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .empty { padding: 22px 12px; text-align: center; color: var(--muted); font-size: 11.5px; }

  .pane-actions { flex: none; display: flex; justify-content: flex-end; padding: 10px 0 12px; }
  .primary {
    font: inherit; font-size: 12px; color: #06222f;
    background: var(--accent); border: 1px solid var(--accent);
    border-radius: 4px; padding: 5px 13px; cursor: pointer;
  }
  .primary:hover { background: #4fbdf3; }
  .primary:disabled { background: #2b3036; border-color: #383f46; color: var(--muted); cursor: default; }
  .primary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .statusbar {
    grid-column: 1 / -1;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 14px;
    background: var(--rail); border-top: 1px solid var(--line);
    color: var(--muted); font-size: 11px;
  }
  .statusbar b { font-weight: 400; color: var(--ink-2); }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="rail-head">
      <span>Devices</span>
      <button class="icon-btn" id="refreshBtn" title="Check again">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
          <path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9"/><path d="M13.5 2.5v3h-3"/>
        </svg>
      </button>
    </div>
    <div class="rail-body">
      <div class="section">This network</div>
      <div class="dev selected" id="devSelf">
        <span class="glyph">
          <svg width="17" height="17" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3">
            <rect x="2" y="3" width="12" height="7.5" rx="1"/><path d="M5.5 13h5"/>
          </svg>
        </span>
        <span class="meta">
          <span class="name" id="selfName">This device</span>
          <span class="status" id="selfStatus">idle</span>
        </span>
      </div>
      <div class="dev" id="devHost">
        <span class="glyph">
          <svg width="17" height="17" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3">
            <circle cx="8" cy="8" r="2"/><circle cx="3" cy="3" r="1.5"/><circle cx="13" cy="3" r="1.5"/>
            <circle cx="3" cy="13" r="1.5"/><circle cx="13" cy="13" r="1.5"/>
            <path d="M4.3 4.3 6.6 6.6M11.7 4.3 9.4 6.6M4.3 11.7 6.6 9.4M11.7 11.7 9.4 9.4"/>
          </svg>
        </span>
        <span class="meta">
          <span class="name" id="hostName">No host</span>
          <span class="status" id="hostStatus">not connected</span>
        </span>
      </div>
    </div>
    <div class="rail-foot"><span class="dot" id="footDot"></span><span id="footText">starting</span></div>
  </aside>

  <section class="content">
    <header class="pane-head">
      <div class="pane-title" id="paneTitle">Not connected</div>
      <div class="pane-sub" id="paneSub">looking for a host on this network</div>
    </header>

    <div class="group">
      <div class="group-label">Sync</div>
      <div class="rows">
        <label class="row switch"><span class="label">Text</span>
          <input type="checkbox" id="swText" checked><span class="track"></span></label>
        <label class="row switch"><span class="label">Images</span>
          <input type="checkbox" id="swImages" checked><span class="track"></span></label>
        <label class="row switch danger"><span class="label">Pause</span>
          <input type="checkbox" id="swPause"><span class="track"></span></label>
      </div>
    </div>

    <div class="group">
      <div class="group-label">This device</div>
      <div class="rows">
        <label class="row switch"><span class="label">Host for the network</span>
          <input type="checkbox" id="swHost"><span class="track"></span></label>
        <label class="row switch"><span class="label">Start with Windows</span>
          <input type="checkbox" id="swBoot"><span class="track"></span></label>
      </div>
    </div>

    <div class="group" id="hostGroup">
      <div class="group-label">Host address</div>
      <div class="rows">
        <div class="row plain">
          <div class="addr" id="addrRow">
            <input type="text" id="hostField" spellcheck="false" placeholder="no host found on this network">
            <button class="mini" id="applyBtn">Apply</button>
          </div>
        </div>
      </div>
    </div>

    <div class="group grow">
      <div class="group-label" id="recentLabel">Recent</div>
      <div class="rows grow" id="list">
        <div class="empty">Nothing yet. Copy text or a screenshot on either device.</div>
      </div>
    </div>

    <div class="pane-actions">
      <button class="primary" id="sendBtn" title="Push what is copied here to the other device">Send now</button>
    </div>
  </section>

  <footer class="statusbar">
    <span id="footLeft">ClipBridge</span>
    <span><b id="footRight">0.8.0</b></span>
  </footer>
</div>

<script>
const $ = (id) => document.getElementById(id);
let lastSig = "";
let known = 0;

function post(path, body) {
  return fetch(path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body || {})
  });
}

$("swText").onchange = (e) => post("/api/toggle", { name: "text", on: e.target.checked });
$("swImages").onchange = (e) => post("/api/toggle", { name: "images", on: e.target.checked });
$("swPause").onchange = (e) => post("/api/toggle", { name: "pause", on: e.target.checked });
$("swBoot").onchange = (e) => post("/api/toggle", { name: "boot", on: e.target.checked });
$("swHost").onchange = (e) => post("/api/toggle", { name: "host", on: e.target.checked }).then(() => setTimeout(poll, 300));
$("sendBtn").onclick = () => post("/api/send");
$("refreshBtn").onclick = () => poll();
$("devHost").onclick = () => $("hostField").focus();
$("devSelf").onclick = () => $("devHost").classList.remove("selected");

$("applyBtn").onclick = () => {
  const v = $("hostField").value.trim();
  if (!v) return;
  $("addrRow").classList.remove("dirty");
  post("/api/server", { server: v }).then(() => setTimeout(poll, 300));
};
$("hostField").addEventListener("keydown", (e) => { if (e.key === "Enter") $("applyBtn").click(); });
$("hostField").addEventListener("input", () => {
  const shown = $("hostField").value.trim().replace(/^https?:\/\//, "");
  const current = String(window.__server || "").replace(/^https?:\/\//, "");
  $("addrRow").classList.toggle("dirty", shown !== current && shown !== "");
});

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function render(state) {
  const hosting = !!state.hosting;
  const connected = !!state.connected;
  const live = hosting || connected;

  $("paneTitle").textContent = hosting ? "Hosting" : connected ? "Connected" : "Not connected";

  const addr = String(hosting ? state.hostAddr : state.server || "").replace(/^https?:\/\//, "");
  $("paneSub").innerHTML = hosting
    ? "serving this clipboard on <code>" + esc(addr || "port 1717") + "</code>"
    : connected
      ? "syncing with <code>" + esc(addr) + "</code>"
      : "no host found on this network";

  window.__server = addr;
  $("hostGroup").style.display = hosting ? "none" : "flex";
  if (!hosting && document.activeElement !== $("hostField")) {
    if ($("hostField").value !== addr) $("hostField").value = addr;
    $("addrRow").classList.remove("dirty");
  }

  $("swText").checked = !!state.syncText;
  $("swImages").checked = !!state.syncImages;
  $("swPause").checked = !!state.paused;
  $("swHost").checked = hosting;
  $("sendBtn").disabled = hosting || !connected;

  $("selfName").textContent = state.device || "This device";
  $("selfStatus").textContent = hosting ? "hosting on " + (addr || "1717") : connected ? "guest, syncing" : "idle";
  $("hostName").textContent = hosting ? "Guests" : addr || "No host";
  $("hostStatus").textContent = hosting ? "any device on this network" : connected ? "connected" : "not connected";

  $("devHost").classList.toggle("selected", hosting);
  $("devSelf").classList.toggle("selected", !hosting);

  $("footDot").className = "dot" + (live ? " on" : "");
  $("footText").textContent = hosting ? "serving the clipboard" : connected ? "syncing" : "waiting for a host";
  $("footLeft").textContent = state.version || "ClipBridge";
  $("footRight").textContent = "same network only";

  const items = state.history || [];
  $("recentLabel").textContent = items.length
    ? "Recent, " + items.length + (items.length === 1 ? " clip" : " clips")
    : "Recent";

  const sig = items.map((c) => c.when + "|" + c.kind + "|" + c.snippet).join("~");
  if (sig === lastSig) return;
  lastSig = sig;
  known = items.length;

  const list = $("list");
  if (!items.length) {
    list.innerHTML = '<div class="empty">Nothing yet. Copy text or a screenshot on either device.</div>';
    return;
  }

  list.innerHTML = items.map((c, i) => {
    const t = new Date(c.when).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false });
    return '<div class="clip" tabindex="0" data-i="' + i + '" role="button" title="Click to copy">' +
      '<span class="time">' + t + '</span>' +
      '<span class="kind ' + esc(c.kind) + '">' + esc(c.kind) + '</span>' +
      '<span class="text">' + esc(c.snippet) + '</span>' +
      '<span class="origin">' + esc(c.origin) + '</span>' +
      '</div>';
  }).join("");

  list.querySelectorAll(".clip").forEach((row) => {
    const copy = () => post("/api/copy", { index: Number(row.dataset.i) });
    row.addEventListener("click", copy);
    row.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); copy(); } });
  });
}

async function poll() {
  try {
    const r = await fetch("/api/state", { cache: "no-store" });
    render(await r.json());
  } catch (e) {
    $("paneTitle").textContent = "Not connected";
    $("paneSub").textContent = "the window lost its backend";
  }
}

poll();
setInterval(poll, 800);
</script>
</body>
</html>
