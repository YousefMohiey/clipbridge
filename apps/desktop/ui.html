<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClipBridge</title>
<style>
  :root {
    --bg: #0e1116;
    --panel: #151a21;
    --line: #26303c;
    --ink: #e6edf3;
    --dim: #8b98a8;
    --accent: #3b82f6;
    --good: #22c55e;
    --bad: #ef4444;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.5 -apple-system, "Segoe UI", system-ui, sans-serif;
  }
  main { max-width: 720px; margin: 0 auto; padding: 28px 22px 40px; }
  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 22px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  .status { font-size: 13px; color: var(--dim); display: flex; align-items: center; gap: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--bad); }
  .dot.on { background: var(--good); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-bottom: 14px; }
  .label { font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--dim); margin-bottom: 10px; }
  .row { display: flex; gap: 10px; align-items: center; }
  input[type=text] {
    flex: 1; background: #10151b; border: 1px solid var(--line); color: var(--ink);
    border-radius: 8px; padding: 9px 11px; font: inherit; outline: none;
  }
  input[type=text]:focus { border-color: var(--accent); }
  button {
    background: #1c2632; border: 1px solid #2f3d4c; color: var(--ink);
    border-radius: 8px; padding: 9px 14px; font: inherit; cursor: pointer;
  }
  button:hover { background: #243040; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { filter: brightness(1.08); }
  .toggles { display: flex; gap: 22px; flex-wrap: wrap; }
  .toggle { display: flex; align-items: center; gap: 8px; color: var(--ink); cursor: pointer; user-select: none; }
  .toggle input { accent-color: var(--accent); width: 15px; height: 15px; }
  .clip { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
  .clip:first-child { border-top: none; }
  .when { color: var(--dim); font-size: 12px; width: 62px; flex: none; }
  .kind { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); width: 46px; flex: none; }
  .text { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .from { color: var(--dim); font-size: 12px; width: 66px; flex: none; text-align: right; }
  .empty { color: var(--dim); padding: 8px 0; }
  footer { color: var(--dim); font-size: 12px; margin-top: 18px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>ClipBridge</h1>
    <div class="status"><span class="dot" id="dot"></span><span id="status">Starting</span></div>
  </header>

  <div class="card">
    <div class="label">Host</div>
    <div class="row">
      <input type="text" id="server" placeholder="searching the network">
      <button id="apply">Apply</button>
      <button id="send" class="primary">Send now</button>
    </div>
  </div>

  <div class="card">
    <div class="label">Sync</div>
    <div class="toggles">
      <label class="toggle"><input type="checkbox" id="tText" checked> Text</label>
      <label class="toggle"><input type="checkbox" id="tImages" checked> Images</label>
      <label class="toggle"><input type="checkbox" id="tPause"> Pause</label>
    </div>
  </div>

  <div class="card">
    <div class="label">Recent</div>
    <div id="history"><div class="empty">Nothing yet. Copy something on either machine.</div></div>
  </div>

  <footer>Runs in the background. Close this tab whenever, nothing stops.</footer>
</main>

<script>
const $ = (id) => document.getElementById(id);
let lastRender = "";

function toggle(name, on) {
  fetch("/api/toggle", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name, on })
  });
}

$("apply").onclick = () => {
  const server = $("server").value.trim();
  if (!server) return;
  fetch("/api/server", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ server })
  }).then(() => setTimeout(poll, 400));
};

$("send").onclick = () => fetch("/api/send", { method: "POST" });

$("tText").onchange = (e) => toggle("text", e.target.checked);
$("tImages").onchange = (e) => toggle("images", e.target.checked);
$("tPause").onchange = (e) => toggle("pause", e.target.checked);

function render(state) {
  $("dot").className = "dot" + (state.connected ? " on" : "");
  $("status").textContent = state.message || "Starting";
  if (document.activeElement !== $("server")) $("server").value = state.server || "";
  $("tText").checked = state.syncText;
  $("tImages").checked = state.syncImages;
  $("tPause").checked = state.paused;

  const list = state.history || [];
  if (!list.length) {
    $("history").innerHTML = '<div class="empty">Nothing yet. Copy something on either machine.</div>';
    return;
  }
  $("history").innerHTML = list.map((c, i) => {
    const t = new Date(c.when).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
    return `<div class="clip" onclick="copyItem(${i})" style="cursor:pointer">
      <span class="when">${t}</span>
      <span class="kind">${c.kind}</span>
      <span class="text">${escapeHtml(c.snippet)}</span>
      <span class="from">${escapeHtml(c.origin)}</span>
    </div>`;
  }).join("");
}

function copyItem(i) {
  fetch("/api/copy", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ index: i })
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (ch) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[ch]));
}

async function poll() {
  try {
    const r = await fetch("/api/state", { cache: "no-store" });
    const state = await r.json();
    render(state);
  } catch (e) {
    $("status").textContent = "Window lost the app";
    $("dot").className = "dot";
  }
}

poll();
setInterval(poll, 800);
</script>
</body>
</html>
